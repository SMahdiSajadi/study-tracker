{% extends 'tracker/base.html' %}

{% block title %}ورود به سیستم{% endblock %}

{% block content %}
<div class="card login-card mx-auto">
    <h2 class="text-center mb-4">ورود دانش‌آموز</h2>
    <form method="post">
        {% csrf_token %}
        <!-- نمایش خطاهای فرم -->
        {% if form.errors %}
            <div style="background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem;">
                نام کاربری یا رمز عبور اشتباه است.
            </div>
        {% endif %}

        <div class="form-group">
            <label for="id_username">نام کاربری:</label>
            <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="id_password">رمز عبور:</label>
            <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">ورود به داشبورد</button>
    </form>
</div>
{% endblock %}
